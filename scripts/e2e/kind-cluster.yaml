# kind cluster of scripts/e2e_kind.sh. The kubelet resyncs pods every 5 s (default 1 min), so a
# republished WORKFLOW.md (the symphony-workflow ConfigMap) reaches every mount within seconds:
# the certification moves its memory-tracker ticket by republishing the workflow.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        syncFrequency: 5s
