# TEMPLATE for the integration Secrets, when you fill them by hand instead of with
# `symphony setup` / Tern › Setup (which verify each value against the real service first).
# They already exist, empty, from deploy/integrations.yaml. Copy this file outside the
# repository, fill in only what you use, then
#   kubectl replace -n symphony -f integrations.yaml
#   kubectl -n symphony rollout restart deploy/symphony-api deploy/symphony-daemon deploy/symphony-merger
# Use `replace`, never `apply`: an applied value would be erased by the next
# `kubectl apply -k deploy/` (see deploy/integrations.yaml).
#
#   Secret            variables                                  reaches
#   linear-api-key    LINEAR_API_KEY, LINEAR_WEBHOOK_SECRET      api, daemon, merger, sweep,
#                                                                runner/reflector Jobs
#   github-app        GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY,     api, daemon, merger, sweep,
#                     GITHUB_APP_INSTALLATION_ID                 runner/reflector Jobs
#   symphony-slack    SLACK_BOT_TOKEN + SLACK_CHANNEL, or        api, daemon, merger, sweep,
#                     SLACK_WEBHOOK_URL; SLACK_APP_TOKEN         assistant, runner/reflector Jobs
#                     (assistant only)
#   symphony-discord  DISCORD_BOT_TOKEN + DISCORD_CHANNEL_ID, or  api, daemon, merger, sweep,
#                     DISCORD_WEBHOOK_URL                        runner/reflector Jobs
#   symphony-backup   SYMPHONY_BACKUP_ACCESS_KEY_ID,             api, backup CronJob
#                     SYMPHONY_BACKUP_SECRET_ACCESS_KEY
#                     (only by hand: setup does not write it)
#
# Every one is optional for the pods to start: a component without its integration waits
# (setup reports what is missing) instead of crashing.
apiVersion: v1
kind: Secret
metadata:
  name: linear-api-key
stringData:
  LINEAR_API_KEY: lin_api_CHANGE-ME
  # Generated by `symphony setup` (webhooks step); by hand: the signing secret of the Linear
  # webhook pointing at https://<api>/v1/webhooks/linear
  LINEAR_WEBHOOK_SECRET: CHANGE-ME
---
apiVersion: v1
kind: Secret
metadata:
  name: github-app
stringData:
  GITHUB_APP_ID: "CHANGE-ME"
  GITHUB_APP_INSTALLATION_ID: "CHANGE-ME"
  GITHUB_APP_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    CHANGE-ME
    -----END RSA PRIVATE KEY-----
---
# Slack notifications: bot (scope chat:write, invited to the channel) OR incoming webhook;
# the bot wins when both are set. The assistant also needs the app-level token (Socket Mode,
# scope connections:write) next to the bot token.
apiVersion: v1
kind: Secret
metadata:
  name: symphony-slack
stringData:
  SLACK_BOT_TOKEN: xoxb-CHANGE-ME
  SLACK_CHANNEL: C0123456789
  SLACK_WEBHOOK_URL: ""
  SLACK_APP_TOKEN: xapp-CHANGE-ME
---
# Discord notifications: bot (permissions View Channel + Send Messages in the channel) OR
# the channel's webhook URL (https://discord.com/api/webhooks/<id>/<token>); the bot wins
# when both are set. Slack and Discord may both be set: each event goes to both.
apiVersion: v1
kind: Secret
metadata:
  name: symphony-discord
stringData:
  DISCORD_BOT_TOKEN: CHANGE-ME
  DISCORD_CHANNEL_ID: "123456789012345678"
  DISCORD_WEBHOOK_URL: ""
---
# The access keys of the S3 backup target (WORKFLOW.md `backup.s3`; docs/backup.md). Give
# them only PutObject, GetObject, ListBucket and DeleteObject on the backup prefix.
apiVersion: v1
kind: Secret
metadata:
  name: symphony-backup
stringData:
  SYMPHONY_BACKUP_ACCESS_KEY_ID: CHANGE-ME
  SYMPHONY_BACKUP_SECRET_ACCESS_KEY: CHANGE-ME
