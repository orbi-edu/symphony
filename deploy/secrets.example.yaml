# TEMPLATE: the two Secrets an install creates itself. Copy to deploy/secrets.yaml
# (gitignored), fill in, then
#   kubectl apply -n symphony -f deploy/secrets.yaml
# Only `symphony-api` is required: with it and Redis the API starts, and `symphony setup`
# (or Tern › Setup) configures every integration from there (deploy/integrations.yaml,
# deploy/integrations.example.yaml).
#
#   Secret            variables                                  reaches
#   symphony-api      SYMPHONY_BOOTSTRAP_TOKEN (required),       api; merger reads only
#                     GITHUB_WEBHOOK_SECRET (added by setup),    SYMPHONY_PREVIEW_LINK_SECRET
#                     SYMPHONY_PREVIEW_LINK_SECRET (optional)
#   model-provider    AWS_REGION + AWS_BEARER_TOKEN_BEDROCK,     merger (envFrom); runner and
#   (optional)        optionally ANTHROPIC_API_KEY,              reflector read it via the API
#                     OPENAI_API_KEY, …                          and stage it for the engine;
#                                                                the api reads key names only
#
# Model credentials are API keys only (no OAuth, no subscriptions). The usual place is the
# Admin screen (Tern › Admin › Providers): it stores each provider's key in the
# `symphony-providers` Secret (deploy/providers.yaml creates it empty; never edit it by
# hand). `model-provider` is the host-level fallback every attempt also receives.
#
# NEVER reaches a workspace pod: anything above except the provider keys the runner
# stages privately for the engine. REDIS_URL is plain config set in each manifest.
apiVersion: v1
kind: Secret
metadata:
  name: symphony-api
stringData:
  # First admin token, `sym_<8 hex>_<43 url-safe chars>`. Generate with:
  #   python3 -c "import secrets; print(f'sym_{secrets.token_hex(4)}_{secrets.token_urlsafe(32)}')"
  SYMPHONY_BOOTSTRAP_TOKEN: sym_00000000_CHANGE-ME-CHANGE-ME-CHANGE-ME-CHANGE-ME-CHANG
  # The GitHub App's webhook secret (https://<api>/v1/webhooks/github). Leave it out:
  # `symphony setup` generates it and shows it once.
  # GITHUB_WEBHOOK_SECRET: CHANGE-ME
  # Signs the PR preview links (docs/assistant.md#pr-previews): the merger signs, the API
  # verifies. Without it the PR gets no preview links. Rotating it voids every posted link.
  # Uncomment and set a generated value:
  #   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
  # SYMPHONY_PREVIEW_LINK_SECRET: CHANGE-ME
---
# Host-level model credentials, added to every agent's engine environment (runner,
# reflector, merger). Bedrock (the team default): a region plus either a Bedrock API key
# (below) or IRSA / instance-role credentials for the merger (docs/install.md). Workspaces
# cannot use the instance role (the metadata endpoint is blocked by
# deploy/networkpolicy.yaml), so the runner stages these keys for them. Keys saved in the
# Admin screen (symphony-providers) take precedence for the provider they name.
apiVersion: v1
kind: Secret
metadata:
  name: model-provider
stringData:
  AWS_REGION: us-east-1
  AWS_BEARER_TOKEN_BEDROCK: CHANGE-ME
  # Optional fallbacks for omp's built-in providers (uncomment only with a real key):
  # ANTHROPIC_API_KEY: sk-ant-CHANGE-ME
  # OPENAI_API_KEY: sk-CHANGE-ME
