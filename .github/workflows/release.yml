name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release from CHANGELOG.md
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: check the tag against pyproject.toml and the Tern plugin
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in pyproject.toml tern-plugin/plugin.toml; do
            found=$(python3 -c 'import sys, tomllib; d = tomllib.load(open(sys.argv[1], "rb")); print(d.get("project", d)["version"])' "$file")
            if [ "$version" != "$found" ]; then
              echo "tag $GITHUB_REF_NAME does not match $file version $found" >&2
              exit 1
            fi
          done
      - name: release notes
        run: .github/scripts/release_notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Symphony ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
