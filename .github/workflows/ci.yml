name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited`: the stealth check reads the title and description too.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"

jobs:
  lint:
    name: lint, scripts, manifests, links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: uv sync
        run: uv sync --frozen --extra dev
      - name: ruff
        run: uv run ruff check .
      - name: bash -n on the scripts
        run: git ls-files -z '*.sh' | xargs -0 -n 1 bash -n
      # The Tern plugin tests skip here (no `tern` binary), so a syntax error in the plugin
      # would otherwise reach main unnoticed. luau-compile parses every file.
      - name: luau-compile on the Tern plugin
        env:
          LUAU_VERSION: "0.747"
          LUAU_SHA256: 6a740240248e872815865a2cb03b0c327f24939478f1d0081a0540cdfd77fdaa
        run: |
          curl -fsSLo /tmp/luau.zip "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          echo "${LUAU_SHA256}  /tmp/luau.zip" | sha256sum -c -
          unzip -q -o /tmp/luau.zip luau-compile -d /tmp/luau
          git ls-files -z 'tern-plugin/*.luau' | xargs -0 /tmp/luau/luau-compile --null
      - name: kustomize render
        run: |
          kubectl kustomize deploy/ > /dev/null
          kubectl kustomize deploy/cloudflared/ > /dev/null
          kubectl kustomize scripts/e2e/ > /dev/null
      - name: docs link check
        run: python3 scripts/check_links.py

  test:
    name: pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # The redis_client fixture starts its own disposable redis-server on a Unix socket; it
      # never connects to a shared server, so CI installs the binary, not a service container.
      - name: redis-server
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends redis-server
          redis-server --version
      - name: uv sync
        run: uv sync --frozen --extra dev
      # Tern, the real omp, Seiji, the mocked end-to-end run and real models skip by
      # themselves here: no `tern` binary, and SYMPHONY_REAL_OMP, SYMPHONY_SEIJI_BIN and
      # SYMPHONY_E2E_MOCKED are unset.
      - name: pytest
        run: uv run pytest -rs

  # This repository is public (.omp/skills/public-repo-stealth). The operator's denylist is
  # a repository secret, so it is masked in this public log and absent on forks, where the
  # check passes. A hit prints where it is, never the text.
  stealth:
    name: stealth
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: no operator names in the pull request
        env:
          DENY: ${{ secrets.STEALTH_DENYLIST }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$DENY" ]; then echo "no denylist configured: skipped"; exit 0; fi
          hit=0
          check() { if printf '%s' "$2" | grep -qiE -- "$DENY"; then echo "::error::denylisted text in $1"; hit=1; fi; }
          check "the title" "$TITLE"
          check "the description" "$BODY"
          check "the branch name" "$BRANCH"
          # A bot's co-author trailer names the GitHub App, which every pull request page shows anyway.
          check "the commit messages" "$(git log --format=%B "$BASE..$HEAD" | grep -vi '^co-authored-by:' || true)"
          check "the added lines" "$(git diff "$BASE...$HEAD" | grep '^+' | grep -v '^+++' || true)"
          exit "$hit"
