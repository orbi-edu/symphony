name: images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version from pyproject.toml, without v; also updates rolling tags"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write # only the optional mirror uses it (cloud OIDC login)

jobs:
  images:
    name: build and push multi-arch images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # scripts/build_images.sh is the one list of images. With VERSION it checks the tag
      # against pyproject.toml and tags each image twice (orchestrator: <version> and latest;
      # agents: <runtime>-<version> and <runtime>). Several platforms make it use buildx
      # --push with an SBOM and a provenance attestation.
      - name: build and push
        env:
          PLATFORM: linux/amd64,linux/arm64
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_REGISTRY=ghcr.io/$owner" >> "$GITHUB_ENV"
          REGISTRY="ghcr.io/$owner" VERSION="$VERSION" scripts/build_images.sh
      # Optional mirror: copies the VERSION tags (not the rolling ones) to a second registry
      # that takes pushes only through cloud credentials, for clusters that cannot pull from
      # this registry. Today the step supports AWS ECR through OIDC. It runs only when the
      # repository secrets MIRROR_REGISTRY (`<account>.dkr.ecr.<region>.amazonaws.com`),
      # MIRROR_AWS_ROLE_ARN and MIRROR_AWS_REGION are set; secrets keep these values masked in
      # the logs. `imagetools create` copies the index as it is, so the digests stay the same,
      # and a tag that already exists is skipped (ECR repositories may use immutable tags).
      - name: mirror configuration
        id: mirror
        env:
          MIRROR_REGISTRY: ${{ secrets.MIRROR_REGISTRY }}
        run: |
          if [ -n "$MIRROR_REGISTRY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        if: steps.mirror.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ secrets.MIRROR_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.MIRROR_AWS_REGION }}
      - name: mirror the version tags
        if: steps.mirror.outputs.enabled == 'true'
        env:
          MIRROR_REGISTRY: ${{ secrets.MIRROR_REGISTRY }}
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$MIRROR_REGISTRY"
          # shellcheck disable=SC2016 # a literal sed pattern, not an expansion
          runtimes=$(sed -n 's/^RUNTIMES="\${RUNTIMES:-\(.*\)}"$/\1/p' scripts/build_images.sh)
          refs="symphony-orchestrator:$VERSION"
          for runtime in $runtimes; do refs="$refs symphony-agent:$runtime-$VERSION"; done
          for ref in $refs; do
            name="${ref%%:*}" tag="${ref#*:}"
            if aws ecr describe-images --repository-name "$name" --image-ids "imageTag=$tag" >/dev/null 2>&1; then
              echo "$ref: already in the mirror"
              continue
            fi
            docker buildx imagetools create --tag "$MIRROR_REGISTRY/$ref" "$SOURCE_REGISTRY/$ref"
            echo "$ref: mirrored"
          done
