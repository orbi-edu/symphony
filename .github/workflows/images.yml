name: images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: build and push multi-arch images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # scripts/build_images.sh is the one list of images. With VERSION it checks the tag
      # against pyproject.toml and tags each image twice (orchestrator: <version> and latest;
      # agents: <runtime>-<version> and <runtime>). Several platforms make it use buildx
      # --push with an SBOM and a provenance attestation.
      - name: build and push
        env:
          PLATFORM: linux/amd64,linux/arm64
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          REGISTRY="ghcr.io/$owner" VERSION="${GITHUB_REF_NAME#v}" scripts/build_images.sh
